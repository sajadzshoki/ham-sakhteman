services:
  app:
    image: node:22
    working_dir: /app
    command: >
      sh -c "corepack enable &&
             corepack prepare pnpm@11.25.0 --activate &&
             pnpm install --frozen-lockfile &&
             pnpm db:migrate &&
             pnpm db:seed &&
             pnpm build &&
             node .output/server/index.mjs"
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
      APP_BASE_URL: ${APP_BASE_URL}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
      OTP_DEV_CODE: ${OTP_DEV_CODE:-1111}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
    volumes:
      - ${APP_DIR:-.}:/app
      - node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - main
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - default
    restart: unless-stopped

volumes:
  postgres-data:
    name: ham-sakhteman_postgres-data
  node_modules:

networks:
  main:
    external: true
    name: main
